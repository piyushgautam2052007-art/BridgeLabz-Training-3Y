<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Canada</option>
    </select>

    <br><br>

    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label for="city">City:</label>

    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>India Gate</option>
        <option>Goa Beach</option>
    </select>

    <h2>Your Choices</h2>

    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
