<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h1>My City - Agra</h1>

    <!-- loading="lazy" loads the map only when it is needed or near the screen -->
    <iframe
        src="https://www.google.com/maps?q=Agra%20Uttar%20Pradesh&output=embed"
        width="600"
        height="450"
        title="Google Map of Agra"
        loading="lazy">
    </iframe>

</body>
</html>
