<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form autocomplete="off">

        <label>Username:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing
        browsers from automatically storing or filling sensitive information.
    </p>

</body>
</html>
