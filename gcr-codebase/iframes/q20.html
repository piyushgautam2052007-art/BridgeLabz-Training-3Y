<!DOCTYPE html>
<html>

<head>

    <!-- title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- description provides information about the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">

    <!-- author specifies the author of the webpage -->
    <meta
        name="author"
        content="Piyush Gautam">

    <!-- base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link is used to connect external resources such as favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style contains CSS rules; kept empty as instructed -->
    <style>
    </style>

    <!-- script is used for JavaScript; kept empty as instructed -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important HTML head elements.
    </p>

</body>
</html>
