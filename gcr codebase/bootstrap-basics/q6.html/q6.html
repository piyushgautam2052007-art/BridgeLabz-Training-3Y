<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q6.css">
</head>
<body>

<main class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="h3 mb-4">Notifications</h1>

            <div class="alert alert-success">
                Your profile was updated successfully.
            </div>

            <div class="alert alert-info">
                You have a new learning tip available.
            </div>

            <div class="alert alert-danger">
                Your password will expire soon.
            </div>

            <div class="alert alert-warning alert-dismissible fade show">
                A new login was detected on your account.

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <section class="summary p-4 bg-light border rounded mt-4">

                <h2 class="h5">Summary</h2>

                <p>
                    You have 4 notifications, 2 unread messages and 1 pending action.
                </p>

            </section>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
