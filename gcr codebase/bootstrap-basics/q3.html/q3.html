<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header class="bg-dark text-white text-center py-4">
    <h1>Tech Store</h1>
</header>

<main class="container py-5">

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5>Laptop Pro</h5>
                    <p>₹65,000</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top" alt="Phone">
                <div class="card-body">
                    <h5>Smart Phone</h5>
                    <p>₹32,000</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5>Headphones</h5>
                    <p>₹4,500</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top" alt="Watch">
                <div class="card-body">
                    <h5>Smart Watch</h5>
                    <p>₹7,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>

</main>

</body>
</html>
