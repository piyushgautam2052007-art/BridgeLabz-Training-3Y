<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q4.css">
</head>
<body>

<main class="container py-5">

    <h1 class="text-center">Today's Menu</h1>

    <p class="lead text-center">
        Fresh dishes prepared by our chef
    </p>

    <div class="text-center mb-4">
        <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80"
             class="img-fluid rounded food"
             alt="Food">
        <p class="text-muted">Chef's special seasonal bowl</p>
    </div>

    <table class="table table-striped table-bordered text-center">

        <thead class="table-dark">
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Paneer Tikka</td>
                <td>Starter</td>
                <td>₹220</td>
            </tr>
            <tr>
                <td>Veg Biryani</td>
                <td>Main Course</td>
                <td>₹280</td>
            </tr>
            <tr>
                <td>Dal Makhani</td>
                <td>Main Course</td>
                <td>₹240</td>
            </tr>
            <tr>
                <td>Gulab Jamun</td>
                <td>Dessert</td>
                <td>₹120</td>
            </tr>
        </tbody>

    </table>

    <h2>Chef's Specials</h2>

    <ul class="list-group">
        <li class="list-group-item">Truffle Pasta</li>
        <li class="list-group-item">Malai Paneer</li>
        <li class="list-group-item">Chocolate Brownie</li>
    </ul>

</main>

</body>
</html>
