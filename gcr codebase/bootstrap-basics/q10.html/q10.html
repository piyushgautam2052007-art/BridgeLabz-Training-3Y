<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q10.css">
</head>
<body>

<main>

    <div id="travelCarousel"
         class="carousel slide"
         data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active"
                 data-bs-interval="2500">

                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80"
                     class="d-block w-100"
                     alt="Mountain">

                <div class="carousel-caption">
                    <h2>Explore the Mountains</h2>
                    <p>Adventure begins here.</p>
                </div>

            </div>

            <div class="carousel-item"
                 data-bs-interval="2500">

                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80"
                     class="d-block w-100"
                     alt="Beach">

                <div class="carousel-caption">
                    <h2>Relax by the Beach</h2>
                    <p>Enjoy peaceful coastal views.</p>
                </div>

            </div>

            <div class="carousel-item"
                 data-bs-interval="2500">

                <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1400&q=80"
                     class="d-block w-100"
                     alt="City">

                <div class="carousel-caption">
                    <h2>Discover New Cities</h2>
                    <p>Create unforgettable memories.</p>
                </div>

            </div>

        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

    <section class="container py-5">

        <h2>Booking Progress</h2>

        <div class="progress">

            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar"
                 style="width: 70%">

                70%

            </div>

        </div>

    </section>

</main>

<footer class="bg-dark text-white text-center py-4">
    Contact: travel@example.com | +91 98765 43210
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
