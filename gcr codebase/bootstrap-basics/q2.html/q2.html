<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<header class="text-center p-5 bg-white">
    <div class="container">
        <h1 class="fw-bold">Piyush Gautam</h1>
        <p class="lead">Computer Science Student & Web Developer</p>
    </div>
</header>

<main class="container text-center mt-4">

    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
         class="img-fluid rounded-circle profile"
         alt="Profile">

    <div class="mt-4 mb-3">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">

            <form class="bg-white p-5 rounded shadow-sm">
                <h2 class="fw-bold mb-3">Contact Me</h2>

                <input type="text" class="form-control mb-3" placeholder="Your Name">

                <input type="email" class="form-control mb-3" placeholder="Your Email">

                <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>

                <button class="btn btn-dark w-100">Send Message</button>
            </form>

        </div>
    </div>

</main>

</body>
</html>
