<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q7.css">
</head>
<body>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Task Tracker</h1>

        <span class="badge text-bg-danger fs-6">
            5 Pending
        </span>

    </div>

    <div class="list-group">

        <div class="list-group-item d-flex justify-content-between">
            Complete Bootstrap assignment
            <span class="badge text-bg-danger">High</span>
        </div>

        <div class="list-group-item d-flex justify-content-between">
            Practice Java
            <span class="badge text-bg-warning">Medium</span>
        </div>

        <div class="list-group-item d-flex justify-content-between">
            Read documentation
            <span class="badge text-bg-success">Low</span>
        </div>

        <div class="list-group-item d-flex justify-content-between">
            Update portfolio
            <span class="badge text-bg-warning">Medium</span>
        </div>

        <div class="list-group-item d-flex justify-content-between">
            Push project to GitHub
            <span class="badge text-bg-danger">High</span>
        </div>

    </div>

    <button class="btn btn-success mt-4">
        Completed
        <span class="badge text-bg-light text-dark">3</span>
    </button>

</main>

</body>
</html>
