<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Journal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q5.css">
</head>
<body>

<header class="py-4 border-bottom">
    <div class="container">
        <h1 class="fw-bold">Tech Journal</h1>
        <p>Ideas, technology and innovation</p>
    </div>
</header>

<main class="container py-5">

    <div class="row g-4">

        <div class="col-md-6">
            <article class="card h-100 shadow-sm">

                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80"
                     class="card-img-top"
                     alt="Technology">

                <div class="card-body">
                    <h2 class="h4">The Future of Technology</h2>
                    <p>
                        Discover how emerging technologies are changing modern businesses.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>

            </article>
        </div>

        <div class="col-md-6">
            <article class="card h-100 shadow-sm">

                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80"
                     class="card-img-top"
                     alt="Workspace">

                <div class="card-body">
                    <h2 class="h4">Building Better Workspaces</h2>
                    <p>
                        Explore practical ideas for productive and creative teams.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>

            </article>
        </div>

    </div>

</main>

<footer class="text-center py-4">
    © 2026 Tech Journal
</footer>

</body>
</html>
