<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>

<header>
    <h1>Student Dashboard</h1>
</header>

<div class="layout">

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Assignments</a>
        <a href="#">Projects</a>
        <a href="#">Profile</a>
    </aside>

    <main>

        <section class="box">
            <h2>Assignments</h2>
            <p>10 assignments completed.</p>
        </section>

        <section class="box">
            <h2>Progress</h2>
            <p>Your course progress is 75%.</p>
        </section>

        <section class="box">
            <h2>Projects</h2>
            <p>3 projects are currently active.</p>
        </section>

        <section class="box">
            <h2>Attendance</h2>
            <p>Attendance: 90%</p>
        </section>

    </main>

</div>

</body>
</html>
