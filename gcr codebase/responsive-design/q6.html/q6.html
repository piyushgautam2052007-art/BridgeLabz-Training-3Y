<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<h1>Responsive CSS Cheat Sheet</h1>

<main class="cheat-sheet">

    <section>
        <h2>Filters</h2>
        <p>filter: grayscale(100%);</p>
    </section>

    <section>
        <h2>Media Queries</h2>
        <p>@media (max-width: 700px)</p>
    </section>

    <section>
        <h2>Responsive Design</h2>
        <p>Design pages for different screen sizes.</p>
    </section>

    <section>
        <h2>Typography</h2>
        <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
    </section>

</main>

</body>
</html>
