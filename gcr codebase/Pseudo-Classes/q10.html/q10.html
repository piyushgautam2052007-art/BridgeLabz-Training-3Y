<!DOCTYPE html>
<html>
<head>
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

<header>
    <h1>My Mini Website</h1>
</header>

<main>

    <section class="card">

        <div class="image-section">
            <img src="https://picsum.photos/250" alt="Profile image">
        </div>

        <div class="form-section">

            <h2>Contact Us</h2>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Message</label>
                <textarea placeholder="Enter your message"></textarea>

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>

            </form>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 My Mini Website</p>
</footer>

</body>
</html>
