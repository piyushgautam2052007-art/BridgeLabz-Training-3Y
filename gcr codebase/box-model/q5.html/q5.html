<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

<h1>Advanced CSS Selectors</h1>

<section>
    <input type="text" placeholder="Enter your name">

    <a href="https://example.com">Secure Website</a>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Java</li>
        <li>Python</li>
    </ul>

    <div class="parent">
        Parent
        <p>Child paragraph</p>
        <span>Sibling span</span>
    </div>

    <p>Paragraph after parent</p>
</section>

</body>
</html>
